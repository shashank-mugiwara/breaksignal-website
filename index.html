<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BreakSignal AI: software built by AI agents, reviewed by people</title>
    <meta
      name="description"
      content="BreakSignal AI builds software with AI agents running inside our own harness, reviewed and approved by people. Systems engineering for finance, banking, and insurance."
    />
    <link rel="canonical" href="https://breaksignal.ai/" />

    <meta property="og:title" content="BreakSignal AI: software built by AI agents, reviewed by people" />
    <meta
      property="og:description"
      content="BreakSignal AI builds software with AI agents running inside our own harness, reviewed and approved by people. Systems engineering for finance, banking, and insurance."
    />
    <meta property="og:url" content="https://breaksignal.ai/" />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#ffffff" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#0d0f12' : '#ffffff');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111418'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c5221f'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
